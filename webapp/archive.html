<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tweet Archive</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #ece0f2;
    --panel: #f6eefa;
    --ink: #443a52;
    --ink-soft: #7a6c8a;
    --white: #fffdff;

    --viewer: #f7eefb;
    --subscriber: linear-gradient(135deg, #f0a8cc, #d98fc9);
    --subscriber-text: #ffffff;
    --vip: linear-gradient(135deg, #8f7bb0, #5c4a78);
    --vip-text: #ffffff;
    --moderator: linear-gradient(135deg, #f6c6dd, #f0a8cc);
    --moderator-text: #6b4a63;

    --pink: #ea9bc4;
    --pink-deep: #d874ae;
    --purple: #6f5a92;
    --line: #e3cdec;
    --danger: #c2564f;
    --mention: #5f8fb0;
  }

  * { box-sizing: border-box; min-width: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, #f5e6f7 0%, transparent 45%),
                       radial-gradient(circle at 85% 100%, #ddc4ea 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 26px 36px 14px; }
  .topbar .brand { display: flex; align-items: center; gap: 10px; }
  .topbar .brand .icon {
    width: 38px; height: 38px; border-radius: 50%; background: var(--subscriber);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 3px 0 rgba(216,116,174,0.35);
  }
  .topbar h1 { font-weight: 800; font-size: 22px; margin: 0; color: var(--purple); letter-spacing: -0.01em; }
  .topbar-actions button {
    font-family: inherit; font-weight: 700; font-size: 12.5px;
    background: var(--white); border: 1.5px solid var(--line); color: var(--purple);
    padding: 9px 16px; border-radius: 999px; cursor: pointer; margin-left: 8px;
    box-shadow: 0 2px 0 var(--line);
  }
  .topbar-actions button:hover { border-color: var(--pink-deep); color: var(--pink-deep); }
  .corner-actions { position: fixed; bottom: 18px; left: 18px; display: flex; gap: 8px; z-index: 50; }
  .corner-actions button {
    width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--white); color: var(--purple); font-size: 16px; cursor: pointer;
    box-shadow: 0 3px 0 var(--line);
  }
  .corner-actions button:hover { border-color: var(--pink-deep); color: var(--pink-deep); }
  .view-tab-btn.active { background: var(--subscriber); color: #fff; border-color: transparent; }
  .view-tab-btn.active:hover { color: #fff; }

  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 78px); }

  .sidebar { padding: 10px 16px 24px; }
  .sidebar h2 {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-soft); padding: 16px 10px 8px; margin: 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar h2:first-child { padding-top: 10px; }
  .sidebar h2 .manage-link {
    text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 700;
    color: var(--purple); cursor: pointer; text-decoration: underline;
  }
  .folder-tab {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 11px 16px; cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--ink-soft); border-radius: 999px; margin-bottom: 6px;
  }
  .folder-tab .tab-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .folder-tab:hover { background: var(--panel); }
  .folder-tab.active { color: #fff; background: var(--subscriber); box-shadow: 0 3px 0 rgba(216,116,174,0.3); }
  .folder-tab.active .count { color: #fff; background: rgba(255,255,255,0.3); }
  .count {
    font-size: 11.5px; font-weight: 700; color: var(--pink-deep); flex-shrink: 0;
    background: rgba(255,255,255,0.5); padding: 1px 8px; border-radius: 999px;
  }
  .folder-group-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft); padding: 12px 16px 4px; border-top: 1px dashed var(--line); margin-top: 6px;
  }
  .folder-group-label:first-of-type { border-top: none; margin-top: 0; }
  .add-folder-row { display: flex; padding: 10px 10px 0; gap: 6px; }
  .add-folder-row input {
    flex: 1; background: var(--white); border: 1.5px dashed var(--line);
    color: var(--ink); font-size: 12.5px; padding: 8px 12px; border-radius: 999px; font-family: inherit;
  }
  .add-folder-row button {
    background: var(--moderator); border: none; color: #6b4a63; border-radius: 50%;
    cursor: pointer; width: 32px; height: 32px; font-size: 15px; font-weight: 700; flex-shrink: 0;
  }
  .tag-list-scroll { max-height: 260px; overflow-y: auto; }

  .main { padding: 20px 36px 60px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .search-row input {
    flex: 1; background: var(--white); border: 1.5px dashed var(--line);
    color: var(--ink); padding: 12px 18px; font-size: 14px; border-radius: 999px; font-family: inherit;
  }
  .search-row input[type="date"] { flex: 0 0 170px; font-size: 13px; }
  .search-row input::placeholder { color: #c3aed1; }
  .search-hint { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin: 0 0 18px 6px; display: none; }
  .search-hint.active { display: block; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .date-section-header {
    grid-column: 1 / -1; font-size: 12.5px; font-weight: 800; color: var(--purple);
    padding: 16px 4px 2px; border-top: 1.5px dashed rgba(237,228,211,0.4); margin-top: 4px;
  }
  .date-section-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }

  .card {
    background: var(--white); border-radius: 20px; border: 1.5px dashed var(--line);
    padding: 4px; display: flex; flex-direction: column; box-shadow: 0 4px 0 #e3cdec; overflow: hidden;
  }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; padding-right: 8px; }
  .card-tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800;
    padding: 6px 14px 6px 12px; border-radius: 999px 999px 999px 4px; margin: 8px 0 0 10px; white-space: nowrap;
  }
  .card-tag.own { background: var(--subscriber); color: var(--subscriber-text); }
  .card-tag.quote { background: var(--vip); color: var(--vip-text); }
  .card-tag.manual { background: var(--moderator); color: var(--moderator-text); }

  .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--ink-soft); padding: 4px 6px; margin-top: 8px; font-weight: 700; }
  .icon-btn:hover { color: var(--danger); }
  .icon-btn.edit:hover { color: var(--purple); }

  .card-body { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card-text { font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; color: var(--ink); word-break: break-word; }
  .card-text a { color: var(--pink-deep); text-decoration: underline; }
  .inline-mention-chip {
    display: inline-block; background: var(--mention); color: #fff; border-radius: 999px;
    padding: 1px 9px; font-size: 0.92em; font-weight: 700; cursor: pointer; margin: 0 1px;
  }
  .inline-mention-chip:hover { opacity: 0.85; }
  .media-chip { display: inline-block; font-size: 11px; font-weight: 700; background: var(--panel); color: var(--purple); padding: 3px 10px; border-radius: 999px; margin-right: 4px; }
  .missing-badge { display: inline-block; font-size: 10.5px; font-weight: 800; background: #f6d9d5; color: var(--danger); padding: 3px 9px; border-radius: 999px; }
  .private-badge { display: inline-block; font-size: 10.5px; font-weight: 800; background: var(--panel); color: var(--purple); padding: 3px 9px; border-radius: 999px; }
  .unknown-badge { display: inline-block; font-size: 10.5px; font-weight: 700; background: #ece7e2; color: var(--ink-soft); padding: 3px 9px; border-radius: 999px; }
  .link-check-btn { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--ink-soft); font-weight: 700; }
  .link-check-btn:hover { color: var(--purple); }

  .card-meta {
    font-size: 11.5px; color: var(--ink-soft); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-top: 1.5px dashed var(--line); padding-top: 10px; flex-wrap: wrap;
  }
  .card-meta a { color: var(--pink-deep); text-decoration: none; font-weight: 700; white-space: nowrap; }
  .card-meta a:hover { text-decoration: underline; }
  .card-meta .handle-date { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card-form { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
  .card-form-row { display: flex; gap: 6px; width: 100%; }
  .card-form-actions { display: flex; gap: 6px; width: 100%; }
  .card-form select, .card-form input {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 8px 10px;
    border: 1.5px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); min-width: 0;
  }
  .card-form select { flex: 0 0 42%; }
  .card-form input { flex: 1; }
  .card-form button.save-btn {
    flex: 1; background: var(--pink-deep); color: #fff; border: none; border-radius: 999px;
    padding: 9px 0; font-size: 12.5px; font-weight: 800; cursor: pointer;
  }
  .card-form button.save-btn:hover { background: #c25f9a; }
  .card-form button.cancel-btn {
    flex: 0 0 70px; background: var(--panel); color: var(--ink-soft); border: 1.5px solid var(--line);
    border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .archived-row { display: flex; flex-direction: column; gap: 8px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
  .archived-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .archived-badge { font-size: 11.5px; font-weight: 700; color: var(--purple); background: var(--viewer); border-radius: 999px; padding: 6px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .text-edit-btn { background: none; border: none; cursor: pointer; font-size: 11.5px; font-weight: 800; color: var(--purple); flex-shrink: 0; }
  .text-edit-btn:hover { text-decoration: underline; }
  .tag-chip { display: inline-block; background: var(--panel); color: var(--purple); border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700; margin-right: 4px; }
  .tag-chip-clickable { cursor: pointer; }
  .tag-chip-clickable:hover { background: var(--subscriber); color: #fff; }

  .tag-section-title { font-size: 12px; font-weight: 800; color: var(--purple); margin: 20px 0 10px; letter-spacing: 0.03em; }
  .tag-section-title:first-child { margin-top: 0; }
  .tag-chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .tag-chip-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--white); border: 1.5px dashed var(--line); border-radius: 12px; padding: 7px 10px;
  }
  .tag-chip-row .tag-chip-main { display: flex; align-items: center; gap: 6px; cursor: pointer; overflow: hidden; min-width: 0; }
  .tag-chip-row .tag-chip-main:hover .tag-chip-name { color: var(--pink-deep); }
  .tag-chip-name { font-size: 12px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag-chip-main.mention .tag-chip-name { color: var(--mention); }
  .tag-chip-row .tag-chip-main.mention:hover .tag-chip-name { color: var(--mention); opacity: 0.8; }
  .tag-chip-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .tag-chip-actions button { background: none; border: none; cursor: pointer; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); }
  .tag-chip-actions button:hover { color: var(--purple); }
  .tag-chip-actions button.danger:hover { color: var(--danger); }
  .tag-chip-row .count { background: var(--panel); }

  .empty-state { color: var(--ink-soft); font-size: 13px; font-weight: 600; padding: 60px 0; text-align: center; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(68,58,82,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--white); color: var(--ink); padding: 28px; border-radius: 24px; width: 380px; font-family: inherit; border: 2px dashed var(--pink); }
  .modal h3 { margin-top: 0; color: var(--purple); font-weight: 800; }
  .modal label { display: block; font-size: 12px; font-weight: 700; margin-top: 14px; color: var(--ink-soft); }
  .modal input { width: 100%; box-sizing: border-box; padding: 10px 14px; margin-top: 6px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 13px; font-family: inherit; }
  .modal .hint { font-size: 11px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; font-weight: 500; }
  .modal .error { font-size: 12px; color: var(--danger); font-weight: 700; margin-top: 10px; display: none; }
  .modal .error.show { display: block; }
  .modal button.primary { margin-top: 18px; width: 100%; padding: 11px; background: var(--subscriber); color: #fff; border: none; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 800; }
  .modal .reset-link { margin-top: 14px; text-align: center; font-size: 11.5px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="icon">🎀</div>
    <h1 id="titleHome" style="cursor:pointer;">Tweet Archive</h1>
  </div>
  <div class="topbar-actions">
    <button id="cardsViewBtn" class="view-tab-btn">🗂 카드</button>
    <button id="tagsViewBtn" class="view-tab-btn">🏷 태그</button>
    <button id="refreshBtn">↻ 새로고침</button>
    <button id="autoTagBtn" title="특정 단어가 포함되면 자동으로 태그를 붙이는 규칙">🏷 자동태그</button>
    <button id="checkLinksBtn" title="원본 트윗이 삭제/비공개 되었는지 전체 확인">🔗 링크 확인</button>
  </div>
</div>

<div class="corner-actions">
  <button id="settingsBtn" title="설정">⚙</button>
  <button id="lockBtn" title="이 탭에서만 즉시 잠그기">🔒</button>
</div>

<div class="layout">
  <div class="sidebar">
    <h2>서랍 <span class="manage-link" id="folderManageLink">관리</span></h2>
    <div id="folderList"></div>
    <div class="add-folder-row">
      <input type="text" id="newFolderInput" placeholder="새 서랍 이름" />
      <button id="addFolderBtn">+</button>
    </div>

    <h2>미디어</h2>
    <div id="mediaList"></div>
  </div>

  <div class="main">
    <div id="cardsView">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="트윗 내용 검색... (모든 폴더 대상)" />
        <input type="date" id="dateFilterInput" title="날짜로 필터링" />
        <button id="dateFilterClearBtn" title="날짜 필터 해제" style="display:none; flex-shrink:0; background:var(--white); border:1.5px solid var(--line); border-radius:999px; padding:0 14px; font-weight:700; color:var(--ink-soft); cursor:pointer;">✕ 날짜해제</button>
      </div>
      <div class="search-hint" id="searchHint">🔍 검색 중에는 모든 서랍을 통틀어 찾습니다</div>
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;"></div>
    </div>

    <div id="tagsView" style="display:none;">
      <div class="search-row">
        <input type="text" id="tagSearchInput" placeholder="태그 검색..." />
        <input type="text" id="newTagGroupInput" placeholder="새 그룹 이름" style="max-width:160px;" />
        <button id="addTagGroupBtn" style="background:var(--moderator); border:none; color:#6b4a63; border-radius:999px; padding:0 18px; font-weight:800; cursor:pointer;">+ 그룹</button>
      </div>
      <div id="tagsManageGrid"></div>
      <div class="empty-state" id="tagsEmptyState" style="display:none;">아직 달린 태그가 없어요.</div>
    </div>
  </div>
</div>

<script>
const VAULT_KEY = 'tweetArchiverVault'; // 암호화된 {githubToken, gistId}만 저장됨
const SESSION_KEY = 'tweetArchiverSession'; // 이번 탭/브라우저 세션에서만 유지되는 캐시 (탭 닫으면 사라짐)
const FILE_NAME = 'tweet-archive.json';

let settings = null; // 메모리에만 존재 (복호화 성공 후에만 채워짐, 평문으로 저장되지 않음)
let data = { items: [] };
let folders = JSON.parse(localStorage.getItem('tweetArchiverFolders') || '[]');
let currentFilter = 'all';
let mainView = 'cards'; // 'cards' | 'tags'
let searchTerm = '';
let dateFilter = ''; // 'YYYY-MM-DD' or ''
let editingIds = new Set();

function saveFolders() {
  localStorage.setItem('tweetArchiverFolders', JSON.stringify(folders));
}

/* ---------- 서랍 별명 (실제 폴더 값=아이디는 그대로 두고, 화면 표시용 별명만 매핑) ----------
   기기/브라우저가 바뀌어도 유지되도록 로컬저장소가 아니라 Gist(data.folderNicknames)에 저장한다. */
function getFolderNicknames() {
  if (!data.folderNicknames || typeof data.folderNicknames !== 'object') data.folderNicknames = {};
  return data.folderNicknames;
}
function saveFolderNicknames(map) {
  data.folderNicknames = map; // 실제 Gist 반영은 호출부에서 saveToGist()로 처리
}
function folderDisplayName(folder) {
  const nicknames = getFolderNicknames();
  return nicknames[folder] || folder;
}

/* ---------- 태그 그룹 (Gist에 저장, { 그룹명: [태그, ...] }) ---------- */
function getTagGroups() {
  if (!data.tagGroups || typeof data.tagGroups !== 'object') data.tagGroups = {};
  return data.tagGroups;
}
function saveTagGroupsLocal(map) {
  data.tagGroups = map;
}
function getTagGroupOf(tag) {
  const groups = getTagGroups();
  for (const g in groups) {
    if (groups[g].includes(tag)) return g;
  }
  return null;
}
async function moveTagToGroup(tag, groupName) {
  const groups = getTagGroups();
  Object.keys(groups).forEach((g) => { groups[g] = groups[g].filter((t) => t !== tag); });
  if (groupName) {
    if (!groups[groupName]) groups[groupName] = [];
    groups[groupName].push(tag);
  }
  saveTagGroupsLocal(groups);
  await saveToGist();
  render();
}
async function createTagGroup(name) {
  const groups = getTagGroups();
  if (!groups[name]) groups[name] = [];
  saveTagGroupsLocal(groups);
  await saveToGist();
  render();
}
async function deleteTagGroup(name) {
  if (!confirm(`"${name}" 그룹을 삭제할까요? 그룹에 속한 태그들은 미분류로 돌아가고, 태그 자체는 지워지지 않아요.`)) return;
  const groups = getTagGroups();
  delete groups[name];
  saveTagGroupsLocal(groups);
  await saveToGist();
  render();
}

/* ---------- 자동 태그 규칙 (기기/브라우저 바뀌어도 유지되도록 Gist에 저장) ---------- */
function getAutoTagRules() {
  if (!Array.isArray(data.autoTagRules)) data.autoTagRules = [];
  return data.autoTagRules; // [{ tags: [], keywords: [] }]
}
function saveAutoTagRules(rules) {
  data.autoTagRules = rules; // 실제 Gist 반영은 호출부에서 saveToGist()로 처리
}
function computeAutoTags(text) {
  if (!text) return [];
  const rules = getAutoTagRules();
  const matched = [];
  rules.forEach((rule) => {
    const hit = (rule.keywords || []).some((kw) => kw && text.includes(kw));
    if (hit) {
      const ruleTags = rule.tags || (rule.tag ? [rule.tag] : []); // 이전 형식(단일 tag) 호환
      matched.push(...ruleTags);
    }
  });
  return Array.from(new Set(matched));
}

// 본문에 있는 실제 @멘션만 정확히 추출해서 태그로 제안 (트위터 핸들 문자 규칙: 영숫자/언더스코어, 최대 15자)
// 단어 중간의 @(이메일 등)는 제외하기 위해 @ 앞이 단어문자가 아니거나 문장 시작인 경우만 매칭
function computeMentionTags(text) {
  if (!text) return [];
  const re = /(?:^|[^\w@])@(\w{1,15})/g;
  const found = new Set();
  let match;
  while ((match = re.exec(text)) !== null) {
    found.add('@' + match[1]);
  }
  return Array.from(found);
}

// 새로 들어온 트윗(자동/수동추가 무관)에 자동태그 규칙 + 멘션 태그를 계산해서 바로 저장까지 해버림.
// 한 번 처리된 항목은 autoTagsApplied 플래그로 표시해서, 나중에 사용자가 태그를 직접 지워도
// 다시 자동으로 채워넣지 않는다.
function autoApplyTagsToNewItems() {
  let changed = false;
  data.items.forEach((item) => {
    if (item.autoTagsApplied) return;
    const suggested = Array.from(new Set([...computeAutoTags(item.text), ...computeMentionTags(item.text)]));
    if (suggested.length > 0) {
      const existing = item.tags || [];
      item.tags = Array.from(new Set([...existing, ...suggested]));
    }
    item.autoTagsApplied = true;
    changed = true;
  });
  return changed;
}

/* ---------- 암호화 유틸 (Web Crypto, AES-GCM + PBKDF2) ---------- */

function bytesToBase64(bytes) {
  let bin = '';
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin);
}
function base64ToBytes(b64) {
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}

async function deriveKey(password, saltB64) {
  const salt = saltB64 ? base64ToBytes(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
  return { key, salt };
}

async function encryptVault(password, obj) {
  const { key, salt } = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipherBuf = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))
  );
  return {
    salt: bytesToBase64(salt),
    iv: bytesToBase64(iv),
    cipher: bytesToBase64(new Uint8Array(cipherBuf)),
  };
}

async function decryptVault(password, vault) {
  const { key } = await deriveKey(password, vault.salt);
  const plainBuf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: base64ToBytes(vault.iv) }, key, base64ToBytes(vault.cipher)
  );
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

function getVault() {
  const raw = localStorage.getItem(VAULT_KEY);
  return raw ? JSON.parse(raw) : null;
}
function saveVault(vault) {
  localStorage.setItem(VAULT_KEY, JSON.stringify(vault));
}

function getSessionSettings() {

/* ---------- Gist 통신 ---------- */

async function fetchAndRenderFromGist() {
  try {
    const res = await fetch(`https://api.github.com/gists/${settings.gistId}`, {
      headers: { Authorization: `token ${settings.githubToken}`, Accept: 'application/vnd.github+json' },
    });
    if (!res.ok) throw new Error('Gist를 불러오지 못했습니다 (' + res.status + ')');
    const gist = await res.json();
    const content = gist.files?.[FILE_NAME]?.content;
    data = content ? JSON.parse(content) : { items: [] };
    if (!Array.isArray(data.items)) data.items = [];

    data.items.forEach((item) => {
      if (item.folder && !folders.includes(item.folder)) folders.push(item.folder);
    });
    saveFolders();

    const foldersChanged = reconcileFolders();
    const tagsChanged = autoApplyTagsToNewItems();
    if (foldersChanged || tagsChanged) await saveToGist();

    render();
  } catch (err) {
    alert('불러오기 실패: ' + err.message);
  }
}

// 핸들 형태(예: KIS2M3T)의 짧은 폴더값이 다른 폴더 이름 안에 부분 문자열로 포함되어 있으면
// (예: "새벽 : KIS2M3T") 자동으로 짧은 쪽을 기준(canonical) 키로 흡수 병합한다.
// 매 로딩마다 실행되므로 중복 서랍이 계속 새로 생기는 걸 막아준다.
function reconcileFolders() {
  const HANDLE_PATTERN = /^[A-Za-z0-9_]{1,20}$/;
  let changed = false;
  let keys = Array.from(new Set(data.items.map((i) => i.folder).filter(Boolean)));

  let mergedSomething = true;
  while (mergedSomething) {
    mergedSomething = false;
    outer:
    for (let i = 0; i < keys.length; i++) {
      for (let j = 0; j < keys.length; j++) {
        if (i === j) continue;
        const a = keys[i], b = keys[j];
        if (a === b || !HANDLE_PATTERN.test(a) || a.length >= b.length) continue;
        if (b.toLowerCase().includes(a.toLowerCase())) {
          const nicknames = getFolderNicknames();
          if (!nicknames[a]) nicknames[a] = b;
          saveFolderNicknames(nicknames);

          data.items.forEach((item) => { if (item.folder === b) item.folder = a; });
          keys = Array.from(new Set(data.items.map((it) => it.folder).filter(Boolean)));
          changed = true;
          mergedSomething = true;
          break outer;
        }
      }
    }
  }

  folders = keys;
  saveFolders();
  return changed;
}

async function saveToGist() {
  const res = await fetch(`https://api.github.com/gists/${settings.gistId}`, {
    method: 'PATCH',
    headers: { Authorization: `token ${settings.githubToken}`, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(data, null, 2) } } }),
  });
  if (!res.ok) alert('저장 실패 (' + res.status + ')');
}

/* ---------- 원본 트윗 삭제/비공개 여부 확인 (트위터 공개 oEmbed API, 로그인 불필요) ----------
   404 = 진짜로 삭제됨 (트윗 자체가 없음)
   401/403 = 존재는 하지만 비공개 계정이라 공개 API로는 확인 불가 (삭제된 건 아님!)
   그 외 = 네트워크 오류 등으로 확인 실패 (다시 시도 필요) */
async function checkLinkStatus(url) {
  try {
    const res = await fetch(`https://publish.twitter.com/oembed?url=${encodeURIComponent(url)}&omit_script=true`);
    if (res.status === 404) return 'missing';
    if (res.status === 401 || res.status === 403) return 'private';
    if (res.ok) return 'ok';
    return 'unknown';
  } catch (e) {
    return 'unknown';
  }
}

async function checkSingleCardLink(item) {
  if (!item.url) return;
  const status = await checkLinkStatus(item.url);
  item.linkStatus = status;
  item.linkCheckedAt = new Date().toISOString();
  await saveToGist();
  render();
}

async function checkAllLinks() {
  const targets = data.items.filter((i) => i.url);
  if (targets.length === 0) { alert('확인할 트윗이 없어요.'); return; }
  if (!confirm(`저장된 트윗 ${targets.length}개의 원본 링크 상태를 확인할까요? 개수가 많으면 시간이 좀 걸려요.`)) return;

  let missingCount = 0;
  let privateCount = 0;
  let unknownCount = 0;
  for (const item of targets) {
    const status = await checkLinkStatus(item.url);
    item.linkStatus = status;
    item.linkCheckedAt = new Date().toISOString();
    if (status === 'missing') missingCount++;
    else if (status === 'private') privateCount++;
    else if (status === 'unknown') unknownCount++;
    await new Promise((r) => setTimeout(r, 350)); // API에 너무 빠르게 연타하지 않도록 살짝 대기
  }
  await saveToGist();
  render();
  alert(
    `확인 완료!\n삭제된 것으로 보이는 트윗: ${missingCount}개\n비공개 계정이라 확인 불가: ${privateCount}개` +
    (unknownCount > 0 ? `\n확인 실패(네트워크 오류 등): ${unknownCount}개 — 나중에 다시 시도해보세요` : '')
  );
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateHeader(iso) {
  if (!iso) return '날짜 없음';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '날짜 없음';
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}

    `;
  };

  // 자동캡처(본인트윗/인용) 트윗이 하나라도 있는 서랍 = 내 계정, 나머지 = 기타
  const myAccountFolders = folders.filter((f) => data.items.some((i) => i.folder === f && i.source !== 'manual'));
  const otherFolders = folders.filter((f) => !myAccountFolders.includes(f));

  if (myAccountFolders.length > 0) {
    html += `<div class="folder-group-label">내 계정</div>`;
    html += myAccountFolders.map(folderTabHtml).join('');
  }
  if (otherFolders.length > 0) {
    html += `<div class="folder-group-label">기타 서랍</div>`;
    html += otherFolders.map(folderTabHtml).join('');
  }
  list.innerHTML = html;

  const mediaList = document.getElementById('mediaList');
  const photoCount = data.items.filter((i) => (i.media || []).includes('photo')).length;
  const videoCount = data.items.filter((i) => (i.media || []).some((m) => m === 'video' || m === 'animated_gif')).length;
  mediaList.innerHTML = `
    <div class="folder-tab ${currentFilter === 'media:photo' ? 'active' : ''}" data-filter="media:photo">
      <span class="tab-label">🖼 이미지</span><span class="count">${photoCount}</span>
    </div>
    <div class="folder-tab ${currentFilter === 'media:video' ? 'active' : ''}" data-filter="media:video">
      <span class="tab-label">🎬 동영상</span><span class="count">${videoCount}</span>
    </div>
  `;

  document.querySelectorAll('.folder-tab').forEach((el) => {
    el.addEventListener('click', () => { currentFilter = el.dataset.filter; mainView = 'cards'; render(); });
  });
}

async function renameFolder(folderKey) {
  const nicknames = getFolderNicknames();
  const current = nicknames[folderKey] || folderKey;
  const newNameRaw = prompt(`"${folderKey}" 서랍에 표시할 별명을 입력하세요\n(실제 분류 기준인 아이디 값은 바뀌지 않아요)`, current);
  if (newNameRaw === null) return;
  const newName = newNameRaw.trim();
  if (!newName) return;

  if (newName === folderKey) {
    delete nicknames[folderKey]; // 원래 아이디랑 같으면 별명 매핑 자체를 지움
  } else {
    nicknames[folderKey] = newName;
  }
  saveFolderNicknames(nicknames);
  await saveToGist();
  render();
}

async function deleteFolder(folderKey) {
  const displayName = folderDisplayName(folderKey);
  const count = data.items.filter((i) => i.folder === folderKey).length;
  if (!confirm(`"${displayName}" 서랍을 삭제할까요? 여기 들어있던 트윗 ${count}개는 미분류로 돌아가요. (트윗 자체는 삭제되지 않습니다)`)) return;

  folders = folders.filter((f) => f !== folderKey);
  saveFolders();

  const nicknames = getFolderNicknames();
  delete nicknames[folderKey];
  saveFolderNicknames(nicknames);

  data.items.forEach((item) => {
    if (item.folder === folderKey) item.folder = null;
  });
  if (currentFilter === folderKey) currentFilter = 'all';

  await saveToGist();
  render();
}

async function mergeFolderInto(sourceKey) {
  const others = folders.filter((f) => f !== sourceKey);
  if (others.length === 0) { alert('합칠 대상이 될 다른 서랍이 없어요.'); return; }

  const hintList = others.map((f) => `${f}${folderDisplayName(f) !== f ? ' (별명: ' + folderDisplayName(f) + ')' : ''}`).join('\n');
  const targetKey = prompt(
    `"${folderDisplayName(sourceKey)}"를 어느 서랍으로 합칠까요?\n아래 목록에서 아이디(맨 앞부분)를 정확히 입력하세요:\n\n${hintList}`,
    ''
  );
  if (!targetKey || !targetKey.trim()) return;
  const target = targetKey.trim();
  if (!others.includes(target)) { alert('목록에 있는 서랍 아이디를 정확히 입력해주세요.'); return; }

  const nicknames = getFolderNicknames();
  if (nicknames[sourceKey] && !nicknames[target]) {
    nicknames[target] = nicknames[sourceKey];
  }
  delete nicknames[sourceKey];
  saveFolderNicknames(nicknames);

  data.items.forEach((item) => {
    if (item.folder === sourceKey) item.folder = target;
  });
  folders = folders.filter((f) => f !== sourceKey);
  saveFolders();
  if (currentFilter === sourceKey) currentFilter = target;

  await saveToGist();
  render();
}

let tagSearchTerm = '';

function getTagCounts() {
  const tagCounts = {};
  data.items.forEach((i) => {
    (i.tags || []).forEach((t) => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  return tagCounts;
}

function renderTagsView() {
  const grid = document.getElementById('tagsManageGrid');
  const emptyState = document.getElementById('tagsEmptyState');
  const tagCounts = getTagCounts();
  let allTagNames = Object.keys(tagCounts);

  if (tagSearchTerm) {
    allTagNames = allTagNames.filter((t) => t.toLowerCase().includes(tagSearchTerm.toLowerCase()));
  }

  if (allTagNames.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.textContent = tagSearchTerm ? '검색 결과가 없어요.' : '아직 달린 태그가 없어요.';
    return;
  }
  emptyState.style.display = 'none';

  const rowHtml = (t) => `
    <div class="tag-chip-row">
      <div class="tag-chip-main ${t.startsWith('@') ? 'mention' : ''}" data-tag="${t}">
        <span class="tag-chip-name">${t.startsWith('@') ? t : '#' + t}</span>
        <span class="count">${tagCounts[t]}</span>
      </div>
      <div class="tag-chip-actions">
        <button class="tag-group-move-btn" data-tag="${t}">그룹</button>
        <button class="tag-rename-btn" data-tag="${t}">수정</button>
        <button class="tag-delete-btn danger" data-tag="${t}">삭제</button>
      </div>
    </div>
  `;

  const groups = getTagGroups();
  const groupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ko'));
  const groupedTagSet = new Set();
  groupNames.forEach((g) => (groups[g] || []).forEach((t) => groupedTagSet.add(t)));
  const ungrouped = allTagNames.filter((t) => !groupedTagSet.has(t)).sort((a, b) => a.localeCompare(b, 'ko'));

  let html = '';
  groupNames.forEach((g) => {
    const tagsInGroup = (groups[g] || [])
      .filter((t) => allTagNames.includes(t))
      .sort((a, b) => a.localeCompare(b, 'ko'));
    html += `
      <div class="tag-section-title">
        📁 ${g} (${tagsInGroup.length})
        <button class="tag-group-delete-btn" data-group="${g}" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;font-weight:700;margin-left:8px;">그룹삭제</button>
      </div>
    `;
    html += tagsInGroup.length > 0
      ? `<div class="tag-chip-grid">${tagsInGroup.map(rowHtml).join('')}</div>`
      : `<div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">아직 이 그룹에 넣은 태그가 없어요.</div>`;
  });

  if (ungrouped.length > 0) {
    html += `<div class="tag-section-title">미분류 (${ungrouped.length})</div>`;
    html += `<div class="tag-chip-grid">${ungrouped.map(rowHtml).join('')}</div>`;
  }

  grid.innerHTML = html;

  grid.querySelectorAll('.tag-chip-main').forEach((el) => {
    el.addEventListener('click', () => {
      currentFilter = `tag:${el.dataset.tag}`;
      mainView = 'cards';
      render();
    });
  });
  grid.querySelectorAll('.tag-rename-btn').forEach((btn) => {
    btn.addEventListener('click', () => renameTagGlobally(btn.dataset.tag));
  });
  grid.querySelectorAll('.tag-delete-btn').forEach((btn) => {
    btn.addEventListener('click', () => deleteTagGlobally(btn.dataset.tag));
  });
  grid.querySelectorAll('.tag-group-move-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const tag = btn.dataset.tag;
      const gNames = Object.keys(getTagGroups());
      const current = getTagGroupOf(tag) || '';
      const hint = gNames.length ? `기존 그룹: ${gNames.join(', ')}\n\n` : '';
      const input = prompt(`${hint}"${tag}"를 넣을 그룹 이름을 입력하세요 (비우면 미분류로 이동)`, current);
      if (input === null) return;
      await moveTagToGroup(tag, input.trim() || null);
    });
  });
  grid.querySelectorAll('.tag-group-delete-btn').forEach((btn) => {
    btn.addEventListener('click', () => deleteTagGroup(btn.dataset.group));
  });
}

async function renameTagGlobally(oldTag) {
  const newTagRaw = prompt('새 태그 이름을 입력하세요', oldTag);
  if (newTagRaw === null) return;
  const newTag = newTagRaw.trim();
  if (!newTag || newTag === oldTag) return;

  data.items.forEach((item) => {
    if (item.tags && item.tags.includes(oldTag)) {
      item.tags = Array.from(new Set(item.tags.map((t) => (t === oldTag ? newTag : t))));
    }
  });
  if (currentFilter === `tag:${oldTag}`) currentFilter = `tag:${newTag}`;

  await saveToGist();
  render();
}

async function deleteTagGlobally(tag) {
  const count = data.items.filter((i) => (i.tags || []).includes(tag)).length;
  if (!confirm(`"${tag}" 태그를 트윗 ${count}개에서 전부 지울까요?`)) return;

  data.items.forEach((item) => {
    if (item.tags) item.tags = item.tags.filter((t) => t !== tag);
  });
  if (currentFilter === `tag:${tag}`) currentFilter = 'all';

  await saveToGist();
  render();
}

function folderOptionsHtml(selected, suggestedHandle) {
  const optionSet = [...folders];
  if (suggestedHandle && !optionSet.includes(suggestedHandle)) optionSet.push(suggestedHandle);
  const effectiveSelected = selected || suggestedHandle || '';
  let html = `<option value="">폴더 선택</option>`;
  optionSet.forEach((f) => {
    html += `<option value="${f}" ${effectiveSelected === f ? 'selected' : ''}>${folderDisplayName(f)}</option>`;
  });
  return html;
}

// 쉼표 입력이 번거로우니, Enter를 누르면 쉼표+공백을 자동으로 넣어주는 편의 기능
// (완전한 칩 입력 UI는 아니지만 "단어 → Enter → 단어 → Enter"로 타이핑하기 훨씬 편해짐)
function enableCommaOnEnter(input) {
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = input.value;
    if (v && !/,\s*$/.test(v)) {
      input.value = v.replace(/\s+$/, '') + ', ';
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// escapeHtml로 이스케이프된 텍스트에서 URL만 찾아 클릭 가능한 링크로 감싼다
function linkifyText(escapedText) {
  return escapedText.replace(
    /(https?:\/\/[^\s<]+)/g,
    (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
  );
}

// 본문 안 @멘션을 태그칩과 같은 모양(단, 다른 색)의 클릭 가능한 인라인 요소로 감싼다
function mentionifyText(escapedText) {
  return escapedText.replace(/(^|[^\w@])@(\w{1,15})/g, (full, pre, handle) => {
    return `${pre}<span class="inline-mention-chip" data-tag="@${handle}">@${handle}</span>`;
  });
}

function matchesCurrentFilter(item) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'unclassified') return !item.folder;
  if (currentFilter === 'media:photo') return (item.media || []).includes('photo');
  if (currentFilter === 'media:video') return (item.media || []).some((m) => m === 'video' || m === 'animated_gif');
  if (currentFilter.startsWith('tag:')) return (item.tags || []).includes(currentFilter.slice(4));
  return item.folder === currentFilter;
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const emptyState = document.getElementById('emptyState');
  const searchHint = document.getElementById('searchHint');

  searchHint.classList.toggle('active', !!searchTerm);

  let items;
  if (searchTerm) {
    items = data.items.filter((i) => (i.text || '').toLowerCase().includes(searchTerm.toLowerCase()));
  } else {
    items = data.items.filter(matchesCurrentFilter);
  }

  if (dateFilter) {
    items = items.filter((i) => {
      const iso = i.createdAt || i.capturedAt;
      return iso && iso.slice(0, 10) === dateFilter;
    });
  }

  if (items.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.textContent = (searchTerm || dateFilter) ? '검색 결과가 없어요.' : '이 목록에는 아직 트윗이 없어요.';
    return;
  }
  emptyState.style.display = 'none';

  items = [...items].sort((a, b) => new Date(b.createdAt || b.capturedAt || 0) - new Date(a.createdAt || a.capturedAt || 0));

  const cardHtml = (item) => {
    const realIdx = data.items.indexOf(item);
    const label = sourceLabel(item.source);
    const isArchived = !!item.folder;
    const isEditing = editingIds.has(item.id);
    const dateTime = formatDateTime(item.createdAt);
    const sortedTags = [...(item.tags || [])].sort((a, b) => {
      const aM = a.startsWith('@'), bM = b.startsWith('@');
      if (aM === bM) return 0;
      return aM ? -1 : 1; // 멘션(@)을 먼저
    });
    const tagsHtml = sortedTags.map((t) =>
      `<span class="tag-chip tag-chip-clickable" data-tag="${t}">${t.startsWith('@') ? t : '#' + t}</span>`
    ).join(' ');
    const mediaHtml = mediaBadges(item.media);
    const showForm = !isArchived || isEditing;

    const existingTags = item.tags || [];
    const autoSuggested = showForm
      ? Array.from(new Set([...computeAutoTags(item.text), ...computeMentionTags(item.text)])).filter((t) => !existingTags.includes(t))
      : [];
    const tagInputValue = [...existingTags, ...autoSuggested].join(', ');

    return `
      <div class="card" data-idx="${realIdx}" data-id="${item.id}">
        <div class="card-top">
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;">
            <span class="card-tag ${label.cls}">${label.icon} ${label.text}</span>
            ${item.linkStatus === 'missing' ? `<span class="missing-badge">삭제</span>` : ''}
            ${item.linkStatus === 'private' ? `<span class="private-badge">비공개</span>` : ''}
            ${item.linkStatus === 'unknown' ? `<span class="unknown-badge">확인불가</span>` : ''}
          </div>
          <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
            <button class="link-check-btn" title="원본 링크 상태 확인">🔗 확인</button>
            <button class="icon-btn delete-btn" title="아카이브에서 삭제" style="margin-top:0;">✕</button>
          </div>
        </div>
        <div class="card-body">
          <div class="card-text">${linkifyText(mentionifyText(escapeHtml(item.text || '(내용 없음)')))}</div>
          ${mediaHtml ? `<div>${mediaHtml}</div>` : ''}
          <div class="card-meta">
            <span class="handle-date">@${item.handle || '?'} · ${dateTime}${item.url ? ` · <a href="${item.url}" target="_blank" rel="noopener">원문 보기 ↗</a>` : ''}</span>
          </div>
          ${showForm
            ? `
            <div class="card-form">
              <div class="card-form-row">
                <select class="folder-select">${folderOptionsHtml(item.folder, item.source !== 'manual' ? item.handle : null)}</select>
                <input type="text" class="tag-input" placeholder="태그 (쉼표로 구분)" value="${tagInputValue}" />
              </div>
              <div class="card-form-actions">
                <button class="save-btn">저장</button>
                ${isEditing ? `<button class="cancel-btn" type="button">취소</button>` : ''}
              </div>
            </div>
          `
            : `
            <div class="archived-row">
              <div class="archived-row-top">
                <div class="archived-badge">🎀 ${folderDisplayName(item.folder)}</div>
                <button class="text-edit-btn edit-btn">수정</button>
              </div>
              ${tagsHtml ? `<div>${tagsHtml}</div>` : ''}
            </div>
          `}
        </div>
      </div>
    `;
  };

  let html = '';
  let lastDateKey = null;
  items.forEach((item) => {
    const dateKey = formatDateHeader(item.createdAt || item.capturedAt);
    if (dateKey !== lastDateKey) {
      html += `<div class="date-section-header">📅 ${dateKey}</div>`;
      lastDateKey = dateKey;
    }
    html += cardHtml(item);
  });
  grid.innerHTML = html;

  grid.querySelectorAll('.tag-input').forEach(enableCommaOnEnter);

  grid.querySelectorAll('.card').forEach((cardEl) => {
    const idx = Number(cardEl.dataset.idx);
    const id = cardEl.dataset.id;

    cardEl.querySelectorAll('.tag-chip-clickable, .inline-mention-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        currentFilter = `tag:${chip.dataset.tag}`;
        searchTerm = '';
        document.getElementById('searchInput').value = '';
        render();
      });
    });

    cardEl.querySelector('.delete-btn').addEventListener('click', async () => {
      if (!confirm('이 트윗을 아카이브에서 완전히 삭제할까요? (원본 트윗은 삭제되지 않습니다)')) return;
      data.items.splice(idx, 1);
      editingIds.delete(id);
      await saveToGist();
      render();
    });

    const linkCheckBtn = cardEl.querySelector('.link-check-btn');
    if (linkCheckBtn) {
      linkCheckBtn.addEventListener('click', async () => {
        linkCheckBtn.textContent = '확인중...';
        await checkSingleCardLink(data.items[idx]);
      });
    }

    const editBtn = cardEl.querySelector('.edit-btn');
    if (editBtn) editBtn.addEventListener('click', () => { editingIds.add(id); renderCards(); });

    const cancelBtn = cardEl.querySelector('.cancel-btn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => { editingIds.delete(id); renderCards(); });

    const saveBtn = cardEl.querySelector('.save-btn');
    if (!saveBtn) return;
    saveBtn.addEventListener('click', async () => {
      const folder = cardEl.querySelector('.folder-select').value.trim();
      const tagsRaw = cardEl.querySelector('.tag-input').value.trim();
      if (!folder) { alert('폴더를 선택해주세요.'); return; }
      const tags = tagsRaw ? tagsRaw.split(',').map((t) => t.trim()).filter(Boolean) : [];

      data.items[idx].folder = folder;
      data.items[idx].tags = tags;
      data.items[idx].archivedAt = new Date().toISOString();

      if (!folders.includes(folder)) { folders.push(folder); saveFolders(); }

      editingIds.delete(id);
      saveBtn.textContent = '저장중...';
      await saveToGist();
      render();
    });
  });
}

function render() {
  document.getElementById('cardsView').style.display = mainView === 'cards' ? '' : 'none';
  document.getElementById('tagsView').style.display = mainView === 'tags' ? '' : 'none';
  document.getElementById('cardsViewBtn').classList.toggle('active', mainView === 'cards');
  document.getElementById('tagsViewBtn').classList.toggle('active', mainView === 'tags');

  renderFolderList();
  if (mainView === 'cards') renderCards();
  else renderTagsView();
}

document.getElementById('settingsBtn').addEventListener('click', () => {
  requireUnlock(() => openSetupModal(fetchAndRenderFromGist));
});
document.getElementById('titleHome').addEventListener('click', () => { currentFilter = 'all'; searchTerm = ''; document.getElementById('searchInput').value = ''; mainView = 'cards'; render(); });
document.getElementById('cardsViewBtn').addEventListener('click', () => { mainView = 'cards'; render(); });
document.getElementById('tagsViewBtn').addEventListener('click', () => { mainView = 'tags'; render(); });
document.getElementById('tagSearchInput').addEventListener('input', (e) => { tagSearchTerm = e.target.value; renderTagsView(); });
document.getElementById('addTagGroupBtn').addEventListener('click', async () => {
  const input = document.getElementById('newTagGroupInput');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  await createTagGroup(name);
});
document.getElementById('autoTagBtn').addEventListener('click', openAutoTagRulesModal);
document.getElementById('folderManageLink').addEventListener('click', openFolderManageModal);
document.getElementById('checkLinksBtn').addEventListener('click', checkAllLinks);
document.getElementById('refreshBtn').addEventListener('click', () => requireUnlock(fetchAndRenderFromGist));
document.getElementById('lockBtn').addEventListener('click', () => {
  settings = null;
  clearSessionSettings();
  data = { items: [] };
  render();
  requireUnlock(fetchAndRenderFromGist);
});
document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderCards(); });
document.getElementById('dateFilterInput').addEventListener('change', (e) => {
  dateFilter = e.target.value;
  document.getElementById('dateFilterClearBtn').style.display = dateFilter ? 'block' : 'none';
  renderCards();
});
document.getElementById('dateFilterClearBtn').addEventListener('click', () => {
  dateFilter = '';
  document.getElementById('dateFilterInput').value = '';
  document.getElementById('dateFilterClearBtn').style.display = 'none';
  renderCards();
});
document.getElementById('addFolderBtn').addEventListener('click', () => {
  const input = document.getElementById('newFolderInput');
  const name = input.value.trim();
  if (!name) return;
  if (!folders.includes(name)) { folders.push(name); saveFolders(); }
  input.value = '';
  render();
});

requireUnlock(fetchAndRenderFromGist);
</script>
</body>
</html>
