<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  body { font-family: -apple-system, sans-serif; width: 320px; padding: 16px; color:#1c1b19; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  h2 { font-size: 12px; margin: 18px 0 6px; color: #6f5a92; }
  p.sub { font-size: 11px; color: #777; margin: 0 0 14px; }
  label { display:block; font-size:12px; margin-top:10px; color:#444; font-weight:600; }
  input { width:100%; box-sizing:border-box; padding:7px 8px; margin-top:4px; font-size:12px; border:1px solid #ccc; border-radius:4px; font-family:inherit; }
  .hint { font-size: 10.5px; color: #999; margin-top: 4px; line-height: 1.4; }
  button { padding:7px 10px; background:#1c1b19; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
  button:hover { background:#35322d; }
  .status { margin-top:10px; font-size:11px; color:#0a7a3d; min-height:14px; }
  hr { border:none; border-top:1px solid #eee; margin:16px 0; }

  .add-row { display:flex; gap:6px; margin-top:6px; }
  .add-row input { margin-top:0; flex:1; }
  .add-row button { flex-shrink:0; }

  .chip-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip {
    display:flex; align-items:center; gap:6px; background:#f6eefa; color:#6f5a92;
    border-radius:999px; padding:4px 6px 4px 12px; font-size:11.5px; font-weight:700;
  }
  .chip button { background:none; border:none; color:#c2564f; font-size:12px; font-weight:800; cursor:pointer; padding:0 4px; }

  .rule-row {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#f6eefa; border-radius:8px; padding:8px 10px; margin-top:6px; font-size:11.5px;
  }
  .rule-row button { background:none; border:none; color:#c2564f; font-size:11px; font-weight:700; cursor:pointer; }

  .disabled-note { font-size:11px; color:#999; margin-top:8px; }
</style>
</head>
<body>
  <h1>트윗 아카이버 설정</h1>
  <p class="sub">gist 권한이 있는 GitHub 토큰과, 데이터를 저장할 Gist ID를 입력하세요.</p>
  <label>GitHub Personal Access Token
    <input type="password" id="token" placeholder="ghp_..." />
  </label>
  <label>Gist ID
    <input type="text" id="gistId" placeholder="예: a1b2c3d4e5f6..." />
  </label>
  <button id="save" style="width:100%; margin-top:14px;">토큰/Gist ID 저장</button>
  <div class="status" id="status"></div>

  <hr />

  <h2>내 계정 목록</h2>
  <div class="hint">등록한 계정의 트윗은 자동추가든 수동추가든 항상 그 아이디 이름 폴더로 분류돼요.</div>
  <div class="add-row">
    <input type="text" id="newHandleInput" placeholder="계정 아이디 (예: k1ttycall)" />
    <button id="addHandleBtn">추가</button>
  </div>
  <div class="chip-list" id="handleList"></div>

  <hr />

  <h2>계정별 폴더 매핑</h2>
  <div class="hint">내 계정이 아닌 남의 계정이라도, 여기 등록해두면 수동추가("＋") 시 지정한 폴더로 자동 분류돼요.</div>
  <div class="add-row">
    <input type="text" id="newRuleFolder" placeholder="폴더명 (예: 엄껀)" style="flex:0 0 40%;" />
    <input type="text" id="newRuleHandle" placeholder="계정 아이디" />
    <button id="addRuleBtn">추가</button>
  </div>
  <div id="ruleList"></div>

  <div class="disabled-note" id="configDisabledNote" style="display:none;">
    토큰/Gist ID를 먼저 저장해야 이 설정들을 불러오고 저장할 수 있어요.
  </div>
  <div class="status" id="configStatus"></div>

  <hr />
  <button id="syncBtn" style="width:100%; background:#6f5a92;">🔄 지금 체크 캐시 동기화</button>
  <div class="hint">Gist에 있는 트윗 목록을 다시 불러와서, 트위터에서 이미 저장된 트윗에 ✓ 표시가 뜨도록 캐시를 최신화해요.</div>
  <div class="status" id="syncStatus"></div>

  <script src="local-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
