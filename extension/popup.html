<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  body { font-family: -apple-system, sans-serif; width: 280px; padding: 16px; color:#1c1b19; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.sub { font-size: 11px; color: #777; margin: 0 0 14px; }
  label { display:block; font-size:12px; margin-top:10px; color:#444; }
  input { width:100%; box-sizing:border-box; padding:7px 8px; margin-top:4px; font-size:12px; border:1px solid #ccc; border-radius:4px; }
  button { margin-top:14px; width:100%; padding:9px; background:#1c1b19; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
  button:hover { background:#35322d; }
  .status { margin-top:10px; font-size:11px; color:#0a7a3d; min-height:14px; }
</style>
</head>
<body>
  <h1>트윗 아카이버 설정</h1>
  <p class="sub">gist 권한이 있는 GitHub 토큰과, 데이터를 저장할 Gist ID를 입력하세요.</p>
  <label>GitHub Personal Access Token
    <input type="password" id="token" placeholder="ghp_..." />
  </label>
  <label>Gist ID
    <input type="text" id="gistId" placeholder="예: a1b2c3d4e5f6..." />
  </label>
  <button id="save">저장</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
